name: Aplikacja na Androida (APK)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # the Ubuntu runner already has the Android SDK (ANDROID_HOME)

      - name: Pack the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js sp ir manifest.json android/app/src/main/assets/www/

      - name: Build
        working-directory: android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show the error
        if: failure()
        working-directory: android
        run: |
          grep -nE "What went wrong|error:|Error|FAILURE|Could not|not found" build.log | head -40 > err.txt || true
          tail -25 build.log >> err.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt | cut -c1-60000)
          echo "::error title=Gradle::${msg}"

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jesienna-warszawa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jesienna-warszawa-apk
          path: jesienna-warszawa.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Jesienna Warszawa – wersja ${{ github.run_number }}
          body: Pobierz plik jesienna-warszawa.apk na telefon i zainstaluj (zgoda na instalację z nieznanych źródeł).
          files: jesienna-warszawa.apk
          make_latest: true
